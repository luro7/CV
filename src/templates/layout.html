<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153b31">
  <title>{{name}} — Data Engineering & AI Automation</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="https://lucasrosat.pages.dev/">

  <script type="application/ld+json">{{structuredData}}</script>
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{name}} — Data Engineering & AI Automation">
  <meta property="og:description" content="{{description}}">

  <link rel="icon" href="/favicon.ico" sizes="48x48">

<body>
  <a class="skip-link" href="#content">Skip to content</a>

    {{hero}}
    {{profile}}
    {{experience}}
    {{education}}
    {{footer}}
  </main>
  <span class="sr-only" role="status" id="preference-status"></span>
