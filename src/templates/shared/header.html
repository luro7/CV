<header class="sidebar">
  <a class="brand" href="#home" aria-label="Lucas Rosat, home"><span aria-hidden="true">[</span> LR <span aria-hidden="true">]</span></a>
  <div class="preferences" role="group" aria-label="Display preferences" hidden>
    <button class="language-toggle preference-button" type="button" data-language-target="{{languageTarget}}" aria-label="{{languageLabel}}" title="{{languageLabel}}"><span aria-hidden="true">{{currentLanguage}}</span><span class="language-next" aria-hidden="true">{{nextLanguage}}</span></button>
    <button class="theme-toggle preference-button" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Dark mode">
      <svg class="sky-toggle" viewBox="0 0 58 34" aria-hidden="true">
        <rect class="toggle-track" x=".5" y=".5" width="57" height="33" rx="16.5"/>
        <circle class="thumb" cx="17" cy="17" r="13"/>
        <g class="sun-rays">
          <path d="M17 7.2v2.2M17 24.6v2.2M7.2 17h2.2M24.6 17h2.2M10.1 10.1l1.6 1.6M22.3 22.3l1.6 1.6M10.1 23.9l1.6-1.6M22.3 11.7l1.6-1.6"/>
        </g>
        <circle class="sun-core" cx="17" cy="17" r="4.7"/>
        <path class="moon-body" d="M22.2 9.7a8.1 8.1 0 1 0 6.7 12.7A8.4 8.4 0 0 1 22.2 9.7Z"/>
        <g class="stars"><circle cx="10" cy="10" r="1"/><circle cx="14" cy="23" r=".8"/><circle cx="25" cy="7.8" r=".7"/></g>
      </svg>
    </button>
    <button class="engineering-toggle preference-button icon-button" type="button" aria-pressed="false" aria-controls="engineering-panel" aria-label="Engineering mode" title="Engineering mode"><span aria-hidden="true">&lt;/&gt;</span></button>
    <button class="command-toggle preference-button icon-button" type="button" data-command-open aria-label="Open command palette" title="Open command palette (Ctrl+K)"><span aria-hidden="true">⌕</span></button>
  </div>
  <div class="sidebar-identity"><p class="sidebar-name">Lucas Rosat<span>.</span></p></div>
  <nav aria-label="Main navigation">
    <a href="#home" aria-current="location">Introduction <span class="nav-arrow" aria-hidden="true">↗</span></a>
    <a href="#expertise">Expertise <span class="nav-arrow" aria-hidden="true">↗</span></a>
    <a href="#experience">Experience <span class="nav-arrow" aria-hidden="true">↗</span></a>
    <a href="#education">Education <span class="nav-arrow" aria-hidden="true">↗</span></a>
  </nav>
</header>
