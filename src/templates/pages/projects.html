<!doctype html>
<html lang="{{htmlLang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153b31">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonicalUrl}}">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/project-gallery.css">
  <script type="module" src="/js/project-gallery.js"></script>
</head>
<body class="project-gallery-page">
  <header class="project-gallery-header">
    <a class="project-gallery-brand" href="{{homeUrl}}" aria-label="Lucas Rosat, CV home">LR<span>.</span></a>
    <nav aria-label="Project gallery navigation">
      <a href="{{otherGalleryUrl}}">{{otherLanguage}}</a>
      <a class="back-to-cv" href="{{homeUrl}}">← {{backLabel}}</a>
    </nav>
  </header>
  <main>
    <section class="project-gallery-intro">
      <p class="eyebrow">{{introLabel}}</p>
      <h1>{{pageHeading}}</h1>
      <p>{{projectsIntro}}</p>
    </section>
    <section class="project-gallery-content" aria-label="{{filtersLabel}}">
      <div class="project-filters" role="group" aria-label="{{filtersLabel}}">
        <button type="button" data-project-filter="all" aria-pressed="true">{{allLabel}}</button>
        <button type="button" data-project-filter="web" aria-pressed="false">{{webLabel}}</button>
        <button type="button" data-project-filter="android" aria-pressed="false">{{androidLabel}}</button>
        <button type="button" data-project-filter="windows" aria-pressed="false">{{windowsLabel}}</button>
      </div>
      <div class="projects-grid project-gallery-grid">{{projectCards}}</div>
    </section>
  </main>
  <footer class="project-gallery-footer"><a href="{{homeUrl}}">← {{backLabel}}</a><span>Lucas Rosat · {{footerLabel}}</span></footer>
</body>
</html>
