<article class="certification-card" data-credential-provider="{{credentialProvider}}" data-credential-id="{{credentialId}}" data-credential-url="{{credentialUrl}}">
  <div class="credential-preview" data-credential-preview>
    {{credentialArt}}
  </div>
  <div class="credential-info">
    <p class="credential-issuer"><span>{{institution}}</span><span class="date">{{date}}</span></p>
    <h4>{{title}}</h4>
    <div class="credential-actions">{{credentialAction}}</div>
  </div>
</article>
