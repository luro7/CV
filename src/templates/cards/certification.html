<article class="certification-card">
  <div class="credential-art"><img src="{{image}}" alt="" width="400" height="400" loading="lazy" decoding="async"></div>
  <div class="credential-info"><p class="credential-issuer">{{institution}} · <span class="date">{{date}}</span></p><h4>{{title}}</h4><a href="{{credentialUrl}}" target="_blank" rel="noopener noreferrer"><span>Verify credential</span> <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a></div>
</article>
