<article class="project-card" data-project-category="{{category}}" data-project-slug="{{slug}}">
  <div class="project-card-media">
    {{cardTriggerOpen}}
      {{screenshot}}
    {{cardTriggerClose}}
  </div>
  <div class="project-card-content">
    <span class="project-platform">{{category}}</span>
    <h3 class="project-card-title">{{name}}</h3>
    <p class="project-card-description">{{description}}</p>
    <div class="project-stack">
      <span class="project-stack-label">Stack</span>
      <p class="project-technologies">{{technologies}}</p>
    </div>
    <div class="project-actions">
      <button type="button" class="project-card-action" data-open-project-gallery aria-expanded="false" aria-controls="expanded-gallery-{{slug}}" aria-label="{{openProjectLabel}}: {{name}}">{{openProjectLabel}} <span aria-hidden="true">↗</span></button>
      {{liveLink}}
    </div>
  </div>
</article>
