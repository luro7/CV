<section class="section wrap" id="education" aria-labelledby="education-title" data-engineering-label="credentials.verify()">
  <div class="section-heading"><p class="eyebrow">Education</p><h2 id="education-title">Education <span>& certifications.</span></h2></div>
  <div class="education-ledger">
    <h3 class="column-title">Education</h3>
    <div class="education-list">{{educationCards}}</div>
  </div>
  <div class="credential-wall">
    <div class="credential-wall-heading">
      <h3 class="column-title certification-heading">Certifications</h3>
      <span class="credential-count">{{certificationCount}} verified credentials</span>
    </div>
    <div class="certification-grid">{{certificationCards}}</div>
  </div>
  <div class="languages"><h3>Languages</h3><p><strong>Spanish</strong><span>Native</span></p><p><strong>English</strong><span>C1 · CEFR</span></p></div>
</section>
