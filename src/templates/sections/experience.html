<section class="section experience-section" id="experience" aria-labelledby="experience-title" data-engineering-label="experience.trace()"><div class="wrap">
  <div class="section-heading"><p class="eyebrow">Experience</p><h2 id="experience-title">Professional <span>experience.</span></h2></div>
  <div class="career-layout">
    <aside class="career-rail" data-career-rail aria-hidden="true">
      <span class="career-rail-kicker">{{careerProgressionLabel}}</span>
      <strong class="career-rail-company" data-career-company>{{careerInitialCompany}}</strong>
      <span class="career-rail-role" data-career-role>{{careerInitialRole}}</span>
      <span class="career-rail-date" data-career-date>{{careerInitialDate}}</span>
      <span class="career-rail-meta">{{careerMeta}}</span>
    </aside>
    <div class="career-groups">{{experienceGroups}}</div>
  </div>
</div></section>
