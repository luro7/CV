<section class="section wrap" id="expertise" aria-labelledby="profile-title" data-engineering-label="skills.map()">
  <div class="section-heading"><p class="eyebrow">Technical skills</p><h2 id="profile-title">Technologies <span>& tools.</span></h2></div>
  <div class="skill-map-panel">
    <div class="skill-map-copy">
      <p class="eyebrow">Interactive technology map</p>
      <h3>Explore the technology map</h3>
      <p>Hover, focus or select a technology to trace where it appears in my experience.</p>
      <p class="skill-trace-status" data-skill-status aria-live="polite">Select a technology to trace experience.</p>
    </div>
    <div class="skill-map" id="skill-map" data-skill-map aria-label="Interactive technology map"></div>
  </div>
  <div class="expertise-grid">{{expertiseCards}}</div>
</section>
