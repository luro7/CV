<section class="hero wrap" id="home" aria-labelledby="hero-title" data-engineering-label="profile.render()">
  <div class="hero-signal" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="document-meta"><span>RÉSUMÉ</span><span>Professional profile</span></div>
  <div class="hero-identity">
    <h1 id="hero-title">Lucas Rosat<span>.</span></h1>
    <p class="hero-role">Data Engineering Analyst<br>AI Automation Engineer <span class="role-divider">/</span> SQL Developer</p>
  </div>
  <div class="hero-profile">
    <div class="hero-full-profile">
      <div>{{heroDataProfile}}</div>
      <div>{{heroAiProfile}}</div>
    </div>
    <div class="hero-intro hero-summary">{{heroSummaryContent}}</div>
    <details class="profile-details">
      <summary>Read full profile</summary>
      <div class="profile-details-body">{{aboutDetailContent}}</div>
    </details>
    <ul class="hero-focus" aria-label="Focus areas">{{heroFocus}}</ul>
  </div>
  <div class="hero-pipeline" aria-label="Data pipeline">
    <span>Data</span><span>Transform</span><span>Automate</span><span>AI</span><span>Report</span>
  </div>
</section>
